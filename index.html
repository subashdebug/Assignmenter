<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HandRewrite</title>
<link href="https://fonts.googleapis.com/css2?family=Caveat&family=Homemade+Apple&family=Reenie+Beanie&family=Nanum+Pen+Script&family=Shadows+Into+Light&family=Kristi&family=Indie+Flower&family=Patrick+Hand&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root{--bg:#f3f1ec;--panel:#fff;--text:#1d1d1f;--muted:#6b6b72;--line:#e2e0da;--accent:#2f6fd6;--ink:#1e3fae;--font:Caveat;--fs:26px;--lh:36px;--ls:0.5px;--ws:4px;--m:64px}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#121317;--panel:#1c1d23;--text:#ececf1;--muted:#9a9aa3;--line:#33343c;--accent:#7aa7ff}}
:root[data-theme=dark]{--bg:#121317;--panel:#1c1d23;--text:#ececf1;--muted:#9a9aa3;--line:#33343c;--accent:#7aa7ff}
*{box-sizing:border-box}
body{margin:0;font:14px/1.45 system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);height:100vh;display:flex;flex-direction:column}
header{display:flex;justify-content:space-between;align-items:center;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--panel)}
h1{margin:0;font-size:18px}
h2{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:0 0 10px}
main{flex:1;display:grid;grid-template-columns:minmax(300px,400px) 1fr;min-height:0}
#left{overflow:auto;padding:16px;background:var(--panel);border-right:1px solid var(--line)}
#left section{margin-bottom:22px}
#right{overflow:auto;display:flex;flex-direction:column;min-width:0}
#toolbar{position:sticky;top:0;z-index:2;display:flex;gap:8px;flex-wrap:wrap;padding:10px 16px;background:var(--panel);border-bottom:1px solid var(--line)}
#pages{padding:24px 16px}
input[type=range]{width:100%}
select,input[type=password],textarea{width:100%;padding:7px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--text);font:inherit;margin:4px 0 10px}
label{display:block}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.chk{display:flex;align-items:center;gap:6px;margin-top:18px}
button{font:inherit;border-radius:8px;padding:8px 12px;cursor:pointer;border:1px solid var(--line);background:var(--bg);color:var(--text)}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
button.ghost{background:transparent}
button:disabled{opacity:.5;cursor:default}
.drop{border:2px dashed var(--line);border-radius:12px;padding:18px;text-align:center;margin-bottom:10px}
.row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
#thumb{width:100%;border-radius:8px;margin-bottom:10px;border:1px solid var(--line)}
#status{min-height:1.4em;margin:8px 0;color:var(--muted)}
#status.err{color:#d64545}
#status.ok{color:#2e9e5b}
.bar{height:4px;border-radius:2px;background:linear-gradient(90deg,transparent,var(--accent),transparent);background-size:200% 100%;animation:sl 1.2s linear infinite}
@keyframes sl{from{background-position:200% 0}to{background-position:-200% 0}}
.brow{display:grid;grid-template-columns:1fr auto;gap:4px 6px;padding:8px;border:1px solid var(--line);border-radius:8px;margin-bottom:8px}
.brow select{width:auto;margin:0}
.brow textarea{grid-column:1/-1;margin:0;resize:vertical}
.brow .tools{display:flex;gap:4px;align-items:center}
.brow .tools button{padding:4px 8px}
.brow .sz{grid-column:1/-1}
#measure{position:absolute;left:-9999px;top:0;visibility:hidden}
.page{position:relative;width:794px;height:1123px;margin:0 auto 24px;background:#fffdf7;box-shadow:0 2px 12px rgba(0,0,0,.25);overflow:hidden;color:var(--ink)}
.bg{position:absolute;top:var(--m);left:0;right:0;bottom:0}
.paper-ruled .bg{background:repeating-linear-gradient(to bottom,transparent 0,transparent calc(var(--lh) - 1px),#a9cbe8 calc(var(--lh) - 1px),#a9cbe8 var(--lh))}
.paper-graph .bg{background-image:linear-gradient(#cfe0ee 1px,transparent 1px),linear-gradient(90deg,#cfe0ee 1px,transparent 1px);background-size:24px 24px}
.mline{position:absolute;top:0;bottom:0;left:calc(var(--m) - 16px);width:1px;background:#e88a8a}
.content{position:absolute;top:var(--m);bottom:var(--m);left:var(--m);right:var(--m);overflow:hidden}
.pno{position:absolute;bottom:14px;right:24px;font:12px system-ui;color:#999}
.blk{font-family:var(--font),cursive;font-size:var(--fs);line-height:var(--lh);letter-spacing:var(--ls);word-spacing:var(--ws);color:var(--ink);white-space:pre-wrap;margin:0}
.blk.heading{font-size:calc(var(--fs) * 1.45)}
.blk.gapped{margin-top:var(--lh)}
.blk .w{white-space:nowrap}
.blk.diagram img{display:block;max-height:640px;max-width:100%;user-select:none;pointer-events:none}
.blk.diagram{user-select:none}
.blk.ph{border:1px dashed #999;padding:6px;font:12px/1.4 system-ui;color:#666;line-height:1.4}
@media(max-width:820px){body{height:auto;min-height:100vh}main{grid-template-columns:1fr}#left{border-right:0}#right{min-height:70vh}}
@media print{body{display:block;height:auto;background:#fff}header,#left,#toolbar{display:none}main{display:block}#right{overflow:visible}#pages{padding:0}.page{margin:0;box-shadow:none;break-after:page}@page{size:A4;margin:0}}
</style>
</head>
<body>
<header><h1>HandRewrite</h1><button class="ghost" id="theme">Toggle theme</button></header>
<main>
<aside id="left">
<section>
<h2>1 · Upload</h2>
<div class="drop" id="drop">
<p>Drop a photo of your assignment here</p>
<div class="row"><button class="ghost" id="pick">Choose file</button><button class="ghost" id="snap">Take photo</button></div>
</div>
<input id="file" type="file" accept="image/jpeg,image/png,image/heic,image/heif" hidden>
<input id="cam" type="file" accept="image/*" capture="environment" hidden>
<img id="thumb" alt="Uploaded assignment preview" hidden>
<select id="provider"><option value="gemini">Gemini (Google AI Studio)</option><option value="anthropic">Claude (Anthropic)</option></select><input id="key" type="password" placeholder="Paste your API key">
<button class="primary" id="read" disabled>Read &amp; transcribe</button>
<div id="bar" class="bar" hidden></div>
<p id="status" role="status"></p>
</section>
<section>
<h2>2 · Edit text</h2>
<div id="editor"></div>
<button class="ghost" id="add">+ Add block</button>
</section>
<section>
<h2>3 · Handwriting</h2>
<div class="grid">
<label>Style<select id="font"></select></label>
<label>Ink<select id="inkSel"><option value="#1e3fae">Blue</option><option value="#111111">Black</option><option value="custom">Custom</option></select></label>
</div>
<input id="inkCustom" type="color" value="#1e3fae" hidden>
<div class="grid">
<label>Paper<select id="paper"><option value="ruled">Ruled notebook</option><option value="plain">Plain</option><option value="graph">Graph</option></select></label>
<label class="chk"><input id="mline" type="checkbox" checked> Margin line</label>
</div>
<label>Font size<input id="fs" type="range" min="14" max="44" value="26"></label>
<label>Line spacing<input id="lh" type="range" min="24" max="60" value="36"></label>
<label>Letter spacing<input id="ls" type="range" min="-1" max="4" step="0.1" value="0.5"></label>
<label>Word spacing<input id="ws" type="range" min="0" max="20" value="4"></label>
<label>Natural variation<input id="jit" type="range" min="0" max="100" value="30"></label>
<label>Page margins<input id="mg" type="range" min="30" max="140" value="64"></label>
</section>
</aside>
<div id="right">
<div id="toolbar">
<button class="primary" id="pdf">Download PDF</button>
<button class="ghost" id="png">PNG</button>
<button class="ghost" id="print">Print</button>
<button class="ghost" id="copy">Copy text</button>
</div>
<div id="pages"></div>
</div>
</main>
<div id="measure"></div>
<script>
const $ = id => document.getElementById(id);
const PAGE_W = 794, PAGE_H = 1123;
const FONTS = {'Caveat':'Caveat','Homemade Apple':'"Homemade Apple"','Reenie Beanie':'"Reenie Beanie"','Nanum Pen Script':'"Nanum Pen Script"','Shadows Into Light':'"Shadows Into Light"','Kristi':'Kristi','Indie Flower':'"Indie Flower"','Patrick Hand':'"Patrick Hand"'};
const SYS = 'You transcribe images of school or university assignments. Transcribe ALL text exactly as written, including spelling and punctuation mistakes. Do not fix, rephrase, summarize, translate, or add anything. Preserve structure: headings, numbering, bullet points, line breaks, paragraphs, and blank answer space. Write math and formulas in plain text or LaTeX-style (for example x^2 + 3x - 4 = 0 or frac(a, b)). Mark any diagram, graph or drawing as a separate block whose text is "[DIAGRAM: short description]" and add "box": [x, y, w, h] with fractions (0 to 1) of the full image width and height that enclose it. Block types: heading, paragraph, list, math, diagram. Return ONLY JSON with no markdown fences or commentary: {"blocks":[{"type":"heading|paragraph|list|math|diagram","text":"...","box":[x,y,w,h]}]}. Include box only for diagram blocks. If the image is too blurry to read, return {"error":"blurry"}. If it contains no readable text, return {"error":"no_text"}.';

let blocks = [], srcImg = null, dataUrl = null;

for (const [name] of Object.entries(FONTS)) $('font').add(new Option(name, name));

function setStatus(msg, type) { $('status').textContent = msg; $('status').className = type || ''; }
function setBusy(on) { $('bar').hidden = !on; }
const mg = () => +$('mg').value;
const LH = () => +$('lh').value;
const inkColor = () => $('inkSel').value === 'custom' ? $('inkCustom').value : $('inkSel').value;

function applyVars() {
  const s = document.documentElement.style, v = (k, val) => s.setProperty(k, val);
  v('--font', FONTS[$('font').value] + ', cursive');
  v('--fs', $('fs').value + 'px'); v('--lh', LH() + 'px');
  v('--ls', $('ls').value + 'px'); v('--ws', $('ws').value + 'px');
  v('--m', mg() + 'px'); v('--ink', inkColor());
}

function rng(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function hash(s) { let h = 2166136261; for (const c of s) h = Math.imul(h ^ c.charCodeAt(0), 16777619); return h >>> 0; }

function fillLine(row, line, jit, rnd) {
  line.split(/( +)/).forEach(tok => {
    if (!tok) return;
    if (/^ +$/.test(tok)) { row.appendChild(document.createTextNode(tok)); return; }
    const w = document.createElement('span'); w.className = 'w';
    for (const ch of tok) {
      const c = document.createElement('span'); c.textContent = ch;
      if (jit > 0) {
        c.style.display = 'inline-block';
        c.style.transform = `translateY(${(rnd() - .5) * jit * 3}px) rotate(${(rnd() - .5) * jit * 4}deg) scale(${1 + (rnd() - .5) * jit * .12})`;
      }
      w.appendChild(c);
    }
    row.appendChild(w);
  });
}

function dragStart(e, el, b) {
  const sx = e.clientX - (b.dx || 0), sy = e.clientY - (b.dy || 0);
  const mv = ev => { b.dx = ev.clientX - sx; b.dy = ev.clientY - sy; el.style.transform = `translate(${b.dx}px,${b.dy}px)`; };
  const up = () => { removeEventListener('pointermove', mv); removeEventListener('pointerup', up); };
  addEventListener('pointermove', mv); addEventListener('pointerup', up);
  e.preventDefault();
}

function makeBlock(b) {
  const el = document.createElement('div');
  el.className = 'blk ' + b.type;
  if (b.type === 'diagram') {
    el.classList.add('diagram');
    if (b.img) {
      const im = new Image(); im.alt = 'Diagram'; im.style.width = (b.w || 60) + '%';
      im.onload = () => { if (!b.ok) { b.ok = 1; render(); } };
      im.src = b.img; el.appendChild(im);
    } else { el.classList.add('ph'); el.style.width = (b.w || 60) + '%'; el.textContent = b.text; }
    el.style.transform = `translate(${b.dx || 0}px,${b.dy || 0}px)`;
    el.style.cursor = 'move';
    el.onpointerdown = e => dragStart(e, el, b);
    return el;
  }
  const rnd = rng(hash(b.text)), jit = +$('jit').value / 100;
  b.text.split('\n').forEach(line => {
    const row = document.createElement('div');
    if (!line.trim()) row.innerHTML = '&nbsp;'; else fillLine(row, line, jit, rnd);
    el.appendChild(row);
  });
  return el;
}

function measureBlock(el, gap) {
  const m = $('measure'); m.style.width = (PAGE_W - 2 * mg()) + 'px';
  m.innerHTML = ''; m.appendChild(el);
  return el.offsetHeight + (gap ? LH() : 0);
}

function fitBlock(b, H) {
  if (b.type === 'diagram' || measureBlock(makeBlock(b), false) <= H) return [b];
  const sep = b.text.includes('\n') ? '\n' : ' ';
  const parts = b.text.split(sep);
  if (parts.length < 2) return [b];
  const h = Math.ceil(parts.length / 2);
  return [...fitBlock({ ...b, text: parts.slice(0, h).join(sep) }, H), ...fitBlock({ ...b, text: parts.slice(h).join(sep) }, H)];
}

function layoutPages() {
  const H = PAGE_H - 2 * mg(), pages = [[]];
  let used = 0;
  blocks.forEach(b => {
    for (const part of fitBlock(b, H)) {
      const h0 = measureBlock(makeBlock(part), false);
      const cur = pages[pages.length - 1];
      if (cur.length && used + LH() + h0 > H) { pages.push([]); used = 0; }
      used += (pages[pages.length - 1].length ? LH() : 0) + h0;
      pages[pages.length - 1].push(part);
    }
  });
  return pages;
}

function render() {
  applyVars();
  const root = $('pages'); root.innerHTML = '';
  layoutPages().forEach((list, pi) => {
    const p = document.createElement('div');
    p.className = 'page paper-' + $('paper').value;
    p.innerHTML = '<div class="bg"></div><div class="content"></div><div class="pno"></div>';
    if ($('mline').checked) p.insertAdjacentHTML('beforeend', '<div class="mline"></div>');
    const c = p.querySelector('.content');
    list.forEach((b, k) => { const el = makeBlock(b); if (k) el.classList.add('gapped'); c.appendChild(el); });
    p.querySelector('.pno').textContent = pi + 1;
    root.appendChild(p);
  });
}

function renderEditor() {
  const ed = $('editor'); ed.innerHTML = '';
  blocks.forEach((b, i) => {
    const row = document.createElement('div'); row.className = 'brow';
    const sel = document.createElement('select');
    ['heading', 'paragraph', 'list', 'math', 'diagram'].forEach(t => sel.add(new Option(t, t)));
    sel.value = b.type;
    sel.onchange = () => { b.type = sel.value; renderEditor(); render(); };
    const tools = document.createElement('div'); tools.className = 'tools';
    tools.innerHTML = '<button class="ghost" title="Move up">↑</button><button class="ghost" title="Move down">↓</button><button class="ghost" title="Delete">✕</button>';
    const [up, down, del] = tools.querySelectorAll('button');
    up.onclick = () => { if (i > 0) { [blocks[i - 1], blocks[i]] = [blocks[i], blocks[i - 1]]; renderEditor(); render(); } };
    down.onclick = () => { if (i < blocks.length - 1) { [blocks[i + 1], blocks[i]] = [blocks[i], blocks[i + 1]]; renderEditor(); render(); } };
    del.onclick = () => { blocks.splice(i, 1); renderEditor(); render(); };
    const head = document.createElement('div'); head.style.display = 'contents';
    head.append(sel, tools);
    const ta = document.createElement('textarea');
    ta.value = b.text; ta.rows = Math.min(6, Math.max(1, b.text.split('\n').length));
    ta.oninput = () => { b.text = ta.value; render(); };
    row.append(head, ta);
    if (b.type === 'diagram') {
      const sz = document.createElement('label'); sz.className = 'sz';
      sz.innerHTML = 'Diagram size <input type="range" min="20" max="100">';
      const r = sz.querySelector('input'); r.value = b.w || 60;
      r.oninput = () => { b.w = +r.value; render(); };
      row.append(sz);
    }
    ed.appendChild(row);
  });
}

function crop(box) {
  if (!Array.isArray(box) || box.length !== 4 || !srcImg) return null;
  const [x, y, w, h] = box.map(Number);
  if ([x, y, w, h].some(isNaN) || w <= 0 || h <= 0) return null;
  const W = srcImg.width, H = srcImg.height, pad = 8;
  const sx = Math.max(0, x * W - pad), sy = Math.max(0, y * H - pad);
  const sw = Math.min(W - sx, w * W + 2 * pad), sh = Math.min(H - sy, h * H + 2 * pad);
  const c = document.createElement('canvas'); c.width = sw; c.height = sh;
  c.getContext('2d').drawImage(srcImg, sx, sy, sw, sh, 0, 0, sw, sh);
  return c.toDataURL('image/png');
}

async function transcribe() {
  const key = $('key').value.trim();
  if (!key) throw new Error('Paste your API key first.');
  const raw = $('provider').value === 'gemini' ? await callGemini(key) : await callClaude(key);
  return parseOut(raw);
}
async function callClaude(key) {
  let r;
  try {
    r = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: {'content-type': 'application/json', 'x-api-key': key, 'anthropic-version': '2023-06-01', 'anthropic-dangerous-direct-browser-access': 'true'},
      body: JSON.stringify({
        model: 'claude-sonnet-4-6', max_tokens: 4000, system: SYS,
        messages: [{role: 'user', content: [
          {type: 'image', source: {type: 'base64', media_type: 'image/jpeg', data: dataUrl.split(',')[1]}},
          {type: 'text', text: 'Transcribe this assignment.'}
        ]}]
      })
    });
  } catch { throw new Error('Network error. Check your connection, or make sure this page can reach api.anthropic.com.'); }
  if (!r.ok) {
    const msgs = {400: 'The request was rejected. The image may be too large.', 401: 'Invalid API key.', 403: 'This key is not allowed to use the model.', 404: 'Model not found for this key.', 429: 'Rate limit reached. Wait a moment and try again.'};
    throw new Error(msgs[r.status] || (r.status >= 500 ? 'Claude is temporarily unavailable. Try again shortly.' : 'API error ' + r.status + '.'));
  }
  const j = await r.json();
  return j.content.filter(c => c.type === 'text').map(c => c.text).join('');
}
async function callGemini(key) {
  let r;
  try {
    for (const model of ['gemini-2.5-flash', 'gemini-2.0-flash', 'gemini-flash-latest']) { r = await fetch('https://generativelanguage.googleapis.com/v1beta/models/' + model + ':generateContent?key=' + encodeURIComponent(key), {
      method: 'POST', headers: {'content-type': 'application/json'},
      body: JSON.stringify({systemInstruction: {parts: [{text: SYS}]}, contents: [{parts: [{inline_data: {mime_type: 'image/jpeg', data: dataUrl.split(',')[1]}}, {text: 'Transcribe this assignment.'}]}], generationConfig: {responseMimeType: 'application/json', maxOutputTokens: 8000}})
    }); if (r.status !== 404) break; }
  } catch { throw new Error('Network error. Check your connection.'); }
  if (!r.ok) {
    const msgs = {400: 'Gemini rejected the request. The image may be too large or the key is wrong.', 404: 'Gemini could not find a model for this key. Create a new key in Google AI Studio (New project) and paste it again.', 403: 'This Gemini key is not allowed. Check it in Google AI Studio.', 429: 'Gemini free-tier limit reached. Wait a minute or try again later.'};
    throw new Error(msgs[r.status] || (r.status >= 500 ? 'Gemini is temporarily unavailable. Try again shortly.' : 'Gemini error ' + r.status + '.'));
  }
  const j = await r.json();
  return (j.candidates?.[0]?.content?.parts || []).map(p => p.text || '').join('');
}
function parseOut(text) {
  const m = text.match(/\{[\s\S]*\}/);
  if (!m) throw new Error('Could not understand the AI response. Please try again.');
  let out;
  try { out = JSON.parse(m[0]); } catch { throw new Error('Could not understand the AI response. Please try again.'); }
  if (out.error === 'blurry') throw new Error('The image looks too blurry to read. Retake the photo closer and in good light.');
  if (out.error === 'no_text') throw new Error('No text was found in this image.');
  const list = (out.blocks || []).filter(b => ['heading', 'paragraph', 'list', 'math', 'diagram'].includes(b.type) && typeof b.text === 'string');
  if (!list.length) throw new Error('No text was found in this image.');
  return list.map(b => ({type: b.type, text: b.text, img: b.type === 'diagram' ? crop(b.box) : null, w: 60, dx: 0, dy: 0}));
}

function loadFile(f) {
  if (!f) return;
  if (!/^image\//.test(f.type) && !/\.(heic|heif|jpe?g|png)$/i.test(f.name)) return setStatus('Please choose a JPG, PNG or HEIC image.', 'err');
  if (f.size > 20 * 1024 * 1024) return setStatus('Image is over 20 MB. Please use a smaller photo.', 'err');
  const img = new Image();
  img.onload = () => {
    const s = Math.min(1, 2000 / Math.max(img.width, img.height));
    const c = document.createElement('canvas');
    c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    srcImg = c; dataUrl = c.toDataURL('image/jpeg', 0.9);
    $('thumb').src = dataUrl; $('thumb').hidden = false;
    $('read').disabled = false; setStatus('Image ready. Click Read & transcribe.');
  };
  img.onerror = () => setStatus('This image could not be read. HEIC works only in Safari; otherwise convert it to JPG or PNG first.', 'err');
  img.src = URL.createObjectURL(f);
}

$('pick').onclick = () => $('file').click();
$('snap').onclick = () => $('cam').click();
$('file').onchange = e => loadFile(e.target.files[0]);
$('cam').onchange = e => loadFile(e.target.files[0]);
$('drop').addEventListener('dragover', e => e.preventDefault());
$('drop').addEventListener('drop', e => { e.preventDefault(); loadFile(e.dataTransfer.files[0]); });

$('read').onclick = async () => {
  $('read').disabled = true; setBusy(true); setStatus('Reading your assignment…');
  try {
    blocks = await transcribe();
    renderEditor(); render();
    setStatus(`Transcribed ${blocks.length} blocks. Review and edit them below.`, 'ok');
  } catch (e) { setStatus(e.message, 'err'); }
  finally { setBusy(false); $('read').disabled = !dataUrl; }
};

$('add').onclick = () => { blocks.push({type: 'paragraph', text: '', dx: 0, dy: 0, w: 60}); renderEditor(); render(); };

['fs', 'lh', 'ls', 'ws', 'jit', 'mg', 'paper', 'mline', 'inkSel', 'inkCustom'].forEach(id => $(id).addEventListener('input', () => {
  $('inkCustom').hidden = $('inkSel').value !== 'custom'; render();
}));
$('font').addEventListener('input', () => document.fonts.load('40px ' + FONTS[$('font').value]).then(render));

$('theme').onclick = () => {
  const cur = document.documentElement.dataset.theme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  document.documentElement.dataset.theme = cur === 'dark' ? 'light' : 'dark';
};

const safe = f => async () => { try { await f(); } catch (e) { setStatus('Failed: ' + e.message, 'err'); } };

$('pdf').onclick = safe(async () => {
  await document.fonts.ready;
  const { jsPDF } = window.jspdf, pdf = new jsPDF({unit: 'mm', format: 'a4'});
  const ps = document.querySelectorAll('.page');
  for (let i = 0; i < ps.length; i++) {
    const c = await html2canvas(ps[i], {scale: 2, backgroundColor: '#fffdf7'});
    if (i) pdf.addPage();
    pdf.addImage(c.toDataURL('image/jpeg', 0.92), 'JPEG', 0, 0, 210, 297);
  }
  pdf.save('handrewrite.pdf');
});

$('png').onclick = safe(async () => {
  await document.fonts.ready;
  const ps = document.querySelectorAll('.page');
  for (let i = 0; i < ps.length; i++) {
    const c = await html2canvas(ps[i], {scale: 2, backgroundColor: '#fffdf7'});
    const a = document.createElement('a');
    a.download = `handrewrite-page-${i + 1}.png`; a.href = c.toDataURL('image/png'); a.click();
  }
});

$('print').onclick = () => window.print();

$('copy').onclick = async () => {
  try { await navigator.clipboard.writeText(blocks.map(b => b.text).join('\n\n')); setStatus('Copied text to clipboard.', 'ok'); }
  catch { setStatus('Copy failed. Select the text in the editor instead.', 'err'); }
};

document.fonts.ready.then(render);
renderEditor();
render();
</script>
</body>
</html>
